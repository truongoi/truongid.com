<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14100c" />
    <link rel="icon" href="data:," />
    <title>Truong Nguyen — Professional ID</title>
    <meta name="description" content="The professional card of Truong Nguyen, front-end engineer and builder of practical digital systems." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #14100c;
        --win: #1a140e;
        --win-edge: #3a2c1c;
        --bar: #241b12;
        --amber: #f0a840;
        --amber-bright: #ffd479;
        --amber-soft: #d99a35;
        --amber-dim: #9a7434;
        --warn: #ff8a66;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--amber);
        font-family: var(--mono);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(240, 168, 64, 0.07), transparent 60%),
          var(--bg);
      }

      .window {
        position: relative;
        display: flex;
        flex-direction: column;
        width: min(720px, 100%);
        height: min(680px, 100%);
        background: var(--win);
        border: 1px solid var(--win-edge);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 0 rgba(255, 212, 121, 0.05) inset;
        overflow: hidden;
      }

      .titlebar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px;
        background: var(--bar);
        border-bottom: 1px solid var(--win-edge);
        user-select: none;
        -webkit-user-select: none;
      }

      .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
      .dot.r { background: #e0654f; }
      .dot.y { background: #e8b34b; }
      .dot.g { background: #7fb069; }

      .titlebar .tt {
        flex: 1 1 auto;
        text-align: center;
        font-size: 12.5px;
        color: var(--amber-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-right: 52px;
      }

      .pane {
        flex: 1 1 auto;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 16px 16px 10px;
        font-size: 14px;
        line-height: 1.6;
        scrollbar-width: thin;
        scrollbar-color: var(--win-edge) transparent;
        cursor: text;
      }

      .pane::-webkit-scrollbar { width: 8px; }
      .pane::-webkit-scrollbar-thumb { background: var(--win-edge); border-radius: 4px; }

      .pane p { margin: 0 0 2px; white-space: pre-wrap; word-break: break-word; }
      .pane .bright { color: var(--amber-bright); font-weight: 600; }
      .pane .dim { color: var(--amber-dim); }
      .pane .warn { color: var(--warn); }
      .pane a { color: var(--amber-bright); text-decoration: underline; text-underline-offset: 3px; }
      .pane a:hover { color: #ffe1a1; }

      .pane .ascii {
        font-size: 11px;
        line-height: 1.15;
        font-weight: 700;
        color: var(--amber-bright);
        letter-spacing: 0;
      }

      .prompt-line {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 4px;
      }

      .prompt-label { color: var(--amber-bright); font-weight: 600; white-space: nowrap; }

      .cmd-input {
        width: 100%;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        padding: 0;
        margin: 0;
        font: inherit;
        line-height: inherit;
        color: var(--amber-bright);
        caret-color: transparent; /* the block cursor below is the only blinker */
        position: relative;
      }

      .input-wrap { position: relative; flex: 1 1 auto; min-width: 0; }

      .ghost {
        position: absolute;
        left: 0;
        top: 0;
        font: inherit;
        line-height: inherit;
        white-space: pre;
        pointer-events: none;
        color: transparent;
      }

      .ghost .rest { color: var(--amber-dim); opacity: 0.8; }

      .cursor-block {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 9px;
        height: 17px;
        background: var(--amber);
        animation: blink 1.06s step-end infinite;
        display: none;
        pointer-events: none;
      }

      .poweroff {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: #000;
        color: var(--amber);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 24px;
      }

      .poweroff.on { display: flex; }
      .poweroff p { margin: 0; }
      .poweroff .big { color: var(--amber-bright); font-size: 17px; }
      .poweroff .small { color: var(--amber-dim); font-size: 12.5px; }

      .cursor-block.on { display: block; }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      @media (max-width: 640px) {
        .pane { font-size: 13px; padding: 13px 13px 8px; }
        .pane .ascii { font-size: 6px; }
        .titlebar .tt { margin-right: 0; text-align: left; padding-left: 6px; }
        .window { height: 100%; border-radius: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor-block { animation: none; }
      }

      /* ---------- truongOS desktop: screens wider than 1024px ----------
         Below this width nothing changes: the page stays the fullscreen
         terminal it has always been. Above it, the stage becomes a desktop
         (wallpaper, menu bar, icons, dock) and the terminal becomes one
         window among others. The terminal's own code is untouched. */
      .desktop-ui { display: none; }

      @media (min-width: 1025px) {
        .desktop-ui { display: block; }

        .stage {
          display: block;
          background:
            radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, 0.10), transparent 55%),
            linear-gradient(160deg, #6b8570 0%, #43604b 48%, #2e4a37 100%);
        }

        .window {
          position: absolute;
          width: 720px;
          height: 600px;
          box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 2px 0 rgba(255, 212, 121, 0.05) inset;
        }
        .window.inactive { box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5); }
        .window.inactive .titlebar { opacity: 0.7; }
        .window .titlebar { cursor: grab; }
        .window .titlebar:active { cursor: grabbing; }
        .window .dot { cursor: pointer; }
        .app-window .dot { border: 0; padding: 0; }

        .resize-handle {
          position: absolute;
          right: 0;
          bottom: 0;
          width: 20px;
          height: 20px;
          cursor: nwse-resize;
          z-index: 5;
        }
        .resize-handle::after {
          content: "";
          position: absolute;
          right: 3px;
          bottom: 3px;
          width: 10px;
          height: 10px;
          border-right: 2px solid var(--amber-dim);
          border-bottom: 2px solid var(--amber-dim);
          opacity: 0.6;
        }

        .menubar {
          position: fixed;
          top: 0; left: 0; right: 0;
          height: 30px;
          z-index: 10000;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 14px;
          background: rgba(18, 14, 10, 0.55);
          -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
          color: #f5ead2;
          font-size: 13px;
          user-select: none;
          -webkit-user-select: none;
        }
        .menubar .mleft, .menubar .mright { display: flex; align-items: center; gap: 14px; }
        .menubar .tlogo { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }
        .menubar .appname { font-weight: 700; }
        .menubar .clock { font-variant-numeric: tabular-nums; }
        .menubar svg { display: block; }

        .desktop-icons {
          position: fixed;
          top: 46px;
          left: 16px;
          z-index: 5;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .dicon {
          width: 78px;
          background: none;
          border: 0;
          padding: 0;
          color: #fff;
          font: inherit;
          cursor: pointer;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }
        .dicon .glyph {
          width: 54px;
          height: 46px;
          border-radius: 9px;
          background: rgba(18, 26, 20, 0.55);
          border: 1px solid rgba(255, 255, 255, 0.28);
          display: grid;
          place-items: center;
          font-size: 23px;
        }
        .dicon .lbl { font-size: 12px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
        .dicon:active .glyph { background: rgba(240, 168, 64, 0.35); }

        .dock {
          position: fixed;
          bottom: 10px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 9000;
          display: flex;
          gap: 6px;
          padding: 6px 10px;
          background: rgba(18, 14, 10, 0.55);
          -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
          border: 1px solid rgba(255, 255, 255, 0.14);
          border-radius: 16px;
        }
        .dock:empty { display: none; }
        .dock button {
          background: none;
          border: 0;
          padding: 5px 7px;
          border-radius: 9px;
          font-size: 21px;
          cursor: pointer;
          line-height: 1;
        }
        .dock button:hover { background: rgba(255, 255, 255, 0.14); }
        .dock button.minimized { opacity: 0.5; }

        .app-toolbar {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 12px;
          background: var(--bar);
          border-bottom: 1px solid var(--win-edge);
        }
        .app-toolbar .navbtn {
          width: 26px; height: 26px;
          border-radius: 6px;
          border: 1px solid var(--win-edge);
          background: transparent;
          color: var(--amber);
          font-size: 16px;
          line-height: 1;
          cursor: pointer;
        }
        .app-toolbar .navbtn:disabled { opacity: 0.35; cursor: default; }
        .app-toolbar .app-path { font-size: 12.5px; color: var(--amber-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-body { flex: 1 1 auto; display: flex; min-height: 0; }
        .app-sidebar {
          flex: 0 0 172px;
          background: var(--bar);
          border-right: 1px solid var(--win-edge);
          padding: 10px 8px;
          overflow-y: auto;
        }
        .app-sidebar button {
          display: block;
          width: 100%;
          text-align: left;
          background: none;
          border: 0;
          padding: 7px 10px;
          border-radius: 6px;
          color: var(--amber-dim);
          font: inherit;
          font-size: 13px;
          cursor: pointer;
        }
        .app-sidebar button.active { background: rgba(240, 168, 64, 0.16); color: var(--amber-bright); }
        .app-files { flex: 1 1 auto; overflow-y: auto; padding: 10px; }
        .file-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 8px 10px;
          border-radius: 6px;
          cursor: pointer;
          font-size: 13.5px;
        }
        .file-row:hover { background: rgba(240, 168, 64, 0.09); }
        .file-row .fglyph { font-size: 17px; }
        .note-body {
          flex: 1 1 auto;
          overflow-y: auto;
          padding: 18px 22px;
          white-space: pre-wrap;
          word-break: break-word;
          line-height: 1.7;
          font-size: 14px;
          color: var(--amber-bright);
        }
        .app-window iframe { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #fff; }
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <section class="window" id="termWindow" aria-label="Interactive terminal — Truong Nguyen professional ID">
        <div class="titlebar" aria-hidden="true">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="tt">truong@id: ~ — zsh</span>
        </div>
        <div class="pane" id="pane" aria-live="polite"></div>
        <div class="poweroff" id="poweroff" role="alert">
          <p class="big">It is now safe to turn off your computer.</p>
          <p class="small">(press any key or tap to boot truongOS)</p>
        </div>
      </section>
    </main>
    <div class="desktop-ui" id="desktopUi">
      <header class="menubar" aria-label="truongOS menu bar">
        <div class="mleft">
          <span class="tlogo" aria-label="truongOS">T</span>
          <span class="appname">truongOS</span>
        </div>
        <div class="mright">
          <svg width="18" height="13" viewBox="0 0 18 13" fill="none" aria-label="Wi-Fi" role="img"><circle cx="9" cy="11" r="1.4" fill="currentColor" /><path d="M6.4 8.3a3.8 3.8 0 0 1 5.2 0M3.8 5.7a7.4 7.4 0 0 1 10.4 0M1.2 3.1a11 11 0 0 1 15.6 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-label="Sound" role="img"><path d="M1 5v4h3l4 3.5v-11L4 5H1z" fill="currentColor" /><path d="M11 3.5a4.5 4.5 0 0 1 0 7M13.5 1.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          <span class="clock" id="menuClock"></span>
        </div>
      </header>
      <nav class="desktop-icons" aria-label="Desktop">
        <button class="dicon" data-open="term"><span class="glyph">💻</span><span class="lbl">Terminal</span></button>
        <button class="dicon" data-open="folder:About"><span class="glyph">📁</span><span class="lbl">About</span></button>
        <button class="dicon" data-open="folder:Skills"><span class="glyph">📁</span><span class="lbl">Skills</span></button>
        <button class="dicon" data-open="folder:Sites"><span class="glyph">📁</span><span class="lbl">Sites</span></button>
        <button class="dicon" data-open="app:arcade"><span class="glyph">🎮</span><span class="lbl">Arcade</span></button>
        <button class="dicon" data-open="app:map"><span class="glyph">🗺️</span><span class="lbl">Map</span></button>
      </nav>
      <div class="dock" id="dock" aria-label="Dock"></div>
    </div>
    <script>
      (function () {
        "use strict";

        var DEFAULTS = {
          pageTitle: "Truong Nguyen — Professional ID",
          portraitCode: "TRUONG / ID-01",
          serial: "TN — 2026",
          eyebrow: "Professional identity",
          firstName: "Truong",
          lastName: "Nguyen.",
          role: "Front-end engineer",
          statement: "I build clear, dependable web experiences and practical systems that make complicated work feel simple.",
          specialties: ["Interfaces", "Systems", "Operations"],
          links: []
        };
        var cfg = DEFAULTS;

        var pane = document.getElementById("pane");
        var stage = document.getElementById("stage");
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var history = [];
        var histIdx = -1;
        var currentInput = null;
        var booted = false;
        var bootSkipped = false;

        /* ---------- rendering helpers (textContent only — no innerHTML with data) ---------- */
        function scrollEnd() { pane.scrollTop = pane.scrollHeight; }

        /* While a command runs, its output is collected here and then played
           back line by line with a jittery delay — a sluggish old machine. */
        var outQueue = null;
        function emit(node) {
          if (outQueue) { outQueue.push(node); return; }
          pane.appendChild(node);
          scrollEnd();
        }

        function line(text, cls) {
          var p = document.createElement("p");
          if (cls) p.className = cls;
          p.textContent = text || "";
          emit(p);
          return p;
        }

        function richLine(segments, cls) {
          var p = document.createElement("p");
          if (cls) p.className = cls;
          segments.forEach(function (s) {
            if (s.href) {
              var a = document.createElement("a");
              a.href = s.href;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = s.t;
              p.appendChild(a);
            } else {
              var span = document.createElement("span");
              if (s.c) span.className = s.c;
              span.textContent = s.t;
              p.appendChild(span);
            }
          });
          emit(p);
          return p;
        }

        function blank() { line(""); }

        /* ---------- prompt ---------- */
        function makePrompt() {
          var row = document.createElement("div");
          row.className = "prompt-line";
          var label = document.createElement("span");
          label.className = "prompt-label";
          label.textContent = "visitor@truongid:~$";
          var input = document.createElement("input");
          input.className = "cmd-input";
          input.type = "text";
          input.setAttribute("aria-label", "Terminal command input");
          input.setAttribute("autocomplete", "off");
          input.setAttribute("autocapitalize", "none");
          input.setAttribute("spellcheck", "false");
          input.setAttribute("enterkeyhint", "go");
          var wrap = document.createElement("div");
          wrap.className = "input-wrap";
          var ghost = document.createElement("div");
          ghost.className = "ghost";
          ghost.setAttribute("aria-hidden", "true");
          wrap.appendChild(ghost);
          wrap.appendChild(input);
          var cursor = document.createElement("span");
          cursor.className = "cursor-block";
          row.appendChild(label);
          row.appendChild(wrap);
          row.appendChild(cursor);
          pane.appendChild(row);
          currentInput = input;

          /* Ghost suggestion: complete the typed prefix to a known command,
             shown dim after the text. Tab or → accepts it. */
          function suggestion() {
            var v = input.value;
            if (!v || input.selectionStart !== v.length) return "";
            var lv = v.toLowerCase();
            for (var i = 0; i < HINTS.length; i++) {
              var h = HINTS[i];
              if (h.length > lv.length && h.indexOf(lv) === 0) return h;
            }
            return "";
          }
          function paintGhost() {
            var s = suggestion();
            ghost.textContent = "";
            if (!s) return;
            var pre = document.createElement("span");
            pre.textContent = input.value;
            var rest = document.createElement("span");
            rest.className = "rest";
            rest.textContent = s.slice(input.value.length);
            ghost.appendChild(pre);
            ghost.appendChild(rest);
          }
          /* One single blinker: the block, parked exactly at the caret
             (monospace → measure the text before the caret). */
          var measureCtx = document.createElement("canvas").getContext("2d");
          function placeCursor() {
            if (document.activeElement !== input || input.selectionStart !== input.selectionEnd) {
              cursor.classList.remove("on");
              return;
            }
            measureCtx.font = window.getComputedStyle(input).font;
            var w = measureCtx.measureText(input.value.substring(0, input.selectionStart)).width;
            cursor.style.left = (label.offsetWidth + 8 + w) + "px";
            cursor.classList.add("on");
          }
          function refresh() { paintGhost(); placeCursor(); }
          input.addEventListener("input", refresh);
          input.addEventListener("keyup", placeCursor);
          input.addEventListener("click", placeCursor);
          input.addEventListener("focus", refresh);
          input.addEventListener("blur", function () { cursor.classList.remove("on"); ghost.textContent = ""; });
          input.addEventListener("keydown", function (ev) {
            if (ev.key === "Tab" || (ev.key === "ArrowRight" && input.selectionStart === input.value.length)) {
              var sug = suggestion();
              if (sug) {
                ev.preventDefault();
                input.value = sug;
                refresh();
              } else if (ev.key === "Tab") {
                ev.preventDefault();
              }
              return;
            }
            if (ev.key === "Enter") {
              ev.preventDefault();
              var value = input.value;
              /* freeze this prompt line into static scrollback */
              var echo = document.createElement("span");
              echo.textContent = value;
              echo.style.color = "var(--amber-bright)";
              wrap.replaceChild(echo, input);
              ghost.remove();
              cursor.remove();
              currentInput = null;
              if (value.trim()) { history.push(value); }
              histIdx = history.length;
              run(value);
            } else if (ev.key === "ArrowUp") {
              ev.preventDefault();
              if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ""; refresh(); }
            } else if (ev.key === "ArrowDown") {
              ev.preventDefault();
              if (histIdx < history.length) { histIdx++; input.value = history[histIdx] || ""; refresh(); }
            }
          });
          scrollEnd();
          placeCursor();
          return input;
        }

        function focusInput() { if (currentInput) currentInput.focus({ preventScroll: true }); }

        /* ---------- content builders ---------- */
        function fullName() { return (cfg.firstName + " " + (cfg.lastName || "")).trim(); }
        function specFlags() {
          return (cfg.specialties || []).map(function (s) { return "--" + String(s).toLowerCase().replace(/\s+/g, "-"); });
        }
        var GLOSSES = {
          "interfaces": "clean, usable interfaces for web products",
          "systems": "practical systems that make complicated work feel simple",
          "operations": "dependable day-to-day running of things"
        };
        function gloss(s) { return GLOSSES[String(s).toLowerCase()] || ""; }

        function printMan() {
          var flags = specFlags();
          richLine([{ t: "TRUONG(1)", c: "bright" }, { t: "          User Commands          " }, { t: "TRUONG(1)", c: "bright" }]);
          blank();
          line("NAME", "bright");
          line("    " + fullName().toLowerCase().replace(/\.$/, "") + " — " + String(cfg.role).toLowerCase());
          blank();
          line("SYNOPSIS", "bright");
          richLine([{ t: "    truong " }, { t: flags.map(function (f) { return "[" + f + "]"; }).join(" "), c: "bright" }]);
          blank();
          line("DESCRIPTION", "bright");
          line("    " + cfg.statement);
          blank();
          line("SPECIALTIES", "bright");
          (cfg.specialties || []).forEach(function (s, i) {
            var g = gloss(s);
            richLine([{ t: "    " + flags[i], c: "bright" }, { t: g ? "  " + g : "" }]);
          });
          blank();
          richLine([{ t: "TRUONG(1)", c: "dim" }, { t: "          " + cfg.portraitCode + " · " + cfg.serial + "          " }, { t: "TRUONG(1)", c: "dim" }]);
        }

        function printAbout() {
          richLine([{ t: fullName(), c: "bright" }, { t: " — " + cfg.role }]);
          line(cfg.statement);
          line(cfg.eyebrow + " · " + cfg.portraitCode + " · " + cfg.serial, "dim");
        }

        function printSkills() {
          (cfg.specialties || []).forEach(function (s, i) {
            var g = gloss(s);
            richLine([{ t: specFlags()[i] + "  ", c: "bright" }, { t: s + (g ? " — " + g : "") }]);
          });
        }

        function printNeofetch() {
          richLine([{ t: "truong@truongid", c: "bright" }]);
          line("----------------");

          var measureCtx = document.createElement("canvas").getContext("2d");

            if (document.activeElement !== input || input.selectionStart !== input.selectionEnd) {
              cursor.classList.remove("on");
              return;

            measureCtx.font = window.getComputedStyle(input).font;
            var w = measureCtx.measureText("\u2022".repeat(input.selectionStart)).width;
            cursor.style.left = (label.offsetWidth + 8 + w) + "px";

          input.addEventListener("input", placeCursor);
          input.addEventListener("keyup", placeCursor);
          input.addEventListener("click", placeCursor);

        function fmtMoney(n) { return "$" + Number(n).toFixed(2); }
        function fmtKwh(n) { return Number(n).toFixed(2) + " kWh"; }
        function sessWord(n) { return n === 1 ? "session" : "sessions"; }
        /* ISO 8601 week number — weeks run Monday to Sunday. */
        function isoWeek(dateStr) {
          var p = dateStr.split("-");
          var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
          var day = (d.getUTCDay() + 6) % 7; /* Mon=0 … Sun=6 */
          d.setUTCDate(d.getUTCDate() - day + 3); /* Thursday of this week */
          var firstThu = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
          var fday = (firstThu.getUTCDay() + 6) % 7;
          firstThu.setUTCDate(firstThu.getUTCDate() - fday + 3);
          return 1 + Math.round((d - firstThu) / (7 * 24 * 3600 * 1000));
        }

        function printEv(d) {
          richLine([{ t: "Home EV charging", c: "bright" }, { t: " \u2014 updated " + d.updatedAt + " \u00b7 rate $" + Number(d.ratePerKwh).toFixed(2) + "/kWh", c: "dim" }]);
          blank();
          line("Recent weeks:", "bright");
          var sessions = d.sessions || [];
          /* Group sessions by ISO week (keyed by the week's Thursday),
             newest week first, newest session first inside each week.
             Show the current week plus the two weeks before it. */
          function weekKey(dateStr) {
            var p = dateStr.split("-");
            var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
            var day = (d.getUTCDay() + 6) % 7;
            d.setUTCDate(d.getUTCDate() - day + 3);
            return d.toISOString().slice(0, 10);
          }
          var groups = [], byKey = {};
          sessions.slice().reverse().forEach(function (s) {
            var k = weekKey(s.date);
            if (!byKey[k]) { byKey[k] = { wk: isoWeek(s.date), items: [] }; groups.push(byKey[k]); }
            byKey[k].items.push(s);
          });
          var shown = groups.slice(0, 3);
          /* Battery-% column only appears when a shown session has one;
             otherwise the rows stay compact so brace + total fit one line. */
          var showPct = shown.some(function (g) {
            return g.items.some(function (s) { return s.startPct !== null && s.startPct !== undefined; });
          });
          shown.forEach(function (g, gi) {
            if (gi > 0) blank();
            var n = g.items.length;
            var totCost = 0;
            g.items.forEach(function (s) { totCost += Number(s.cost); });
            /* The total hangs on the brace's tip: the middle row for odd
               counts, the closing row for even counts. Money only. */
            var totalRow = n === 1 ? 0 : (n % 2 === 1 ? Math.floor(n / 2) : n - 1);
            g.items.forEach(function (s, i) {
              var pct = (s.startPct === null || s.startPct === undefined) ? "\u2014" : (s.startPct + "%\u2192" + s.endPct + "%");
              while (pct.length < 7) pct += " ";
              var kwh = Number(s.kwh).toFixed(2);
              while (kwh.length < 5) kwh = " " + kwh;
              var amt = fmtMoney(s.cost);
              while (amt.length < 6) amt = " " + amt;
              var glyph, tail = "";
              if (n === 1) glyph = "}";
              else if (i === 0) glyph = "\u23AB";
              else if (i === n - 1) glyph = "\u23AD";
              else if (i === totalRow) glyph = "\u23AC";
              else glyph = "\u23AA";
              if (i === totalRow) {
                var ta = fmtMoney(Math.round(totCost * 100) / 100);
                while (ta.length < 6) ta = " " + ta;
                tail = "  " + ta;
              }
              line("  W" + g.wk + "  " + s.date.slice(5) + (showPct ? "  " + pct : "") + "  " + kwh + "  " + amt + "  " + glyph + tail);
            });
          });
          blank();
          var cw = d.currentWeek || {};
          var oct = (d.totals || {}).october || {};
          var all = (d.totals || {}).allTime || {};
          var cwLabel = cw.isoWeek ? "This week (W" + String(cw.isoWeek).split("-W")[1] + ")" : "This week";
          line(cwLabel + ": " + fmtKwh(cw.kwh) + " \u00b7 " + fmtMoney(cw.cost) + " (" + cw.sessions + " " + sessWord(cw.sessions) + ")");
          line("October 2026: " + fmtKwh(oct.kwh) + " \u00b7 " + fmtMoney(oct.cost) + " (" + oct.sessions + " " + sessWord(oct.sessions) + ")");
          line("All time: " + fmtKwh(all.kwh) + " \u00b7 " + fmtMoney(all.cost) + " (" + all.sessions + " " + sessWord(all.sessions) + ")");
          blank();
          richLine([{ t: "Mom's dashboard: " }, { t: d.dashboardUrl, href: d.dashboardUrl }]);
          blank();
        }

        /* ---------- command runner ---------- */
        function done() { makePrompt(); focusInput(); }

        /* Play the collected output back like a slow machine: a processing
           pause first, then lines trickle out at uneven intervals. */
        function playQueue(nodes, after) {
          if (!nodes.length || reduceMotion) {
            nodes.forEach(function (n) { pane.appendChild(n); });
            scrollEnd();
            after();
            return;
          }
          var i = 0;
          var step = function () {
            if (i >= nodes.length) { after(); return; }
            pane.appendChild(nodes[i]);
            i++;
            scrollEnd();
            setTimeout(step, 65 + Math.random() * 70);
          };
          setTimeout(step, 280 + Math.random() * 280);
        }

          var nodes = outQueue || [];
          outQueue = null;
          playQueue(nodes, done);

        function run(raw) {
          var input = raw.trim();
          var lower = input.toLowerCase();
          if (!input) { done(); return; }
          outQueue = []; /* collect this command's output for slow playback */

          /* rm -rf outranks the sudo gag — even under sudo */
          var sudoed = lower === "sudo" || lower.indexOf("sudo ") === 0;
          var cmd = sudoed ? lower.slice(4).trim() : lower;
          var isRmRf = cmd.indexOf("rm") === 0 && (cmd.indexOf("-rf") !== -1 || cmd.indexOf("-fr") !== -1) && cmd.indexOf(" /") !== -1;

          if (lower === "man truong") { printMan(); finish(); return; }
          if (lower.indexOf("man ") === 0) { line("No manual entry for " + input.slice(4)); finish(); return; }

          if (lower === "reboot") { outQueue = null; rebootSeq(false); return; }
          if (lower === "yes") {

          if (lower.indexOf("chmod") === 0) { line("Operation not permitted. Also, rude.", "warn"); finish(); return; }

        function boot() {
          if (booted) return;
          booted = true;
          var steps = bootLines();
          if (reduceMotion) {
            steps.forEach(function (fn) { fn(); });
            makePrompt();
            return;
          }
          var delays = [80, 420];
          var timers = [];
          var printed = 0;
          function disarmSkip() {
            window.removeEventListener("pointerdown", skip);
            window.removeEventListener("keydown", skip);
          }
          steps.forEach(function (fn, i) {
            timers.push(setTimeout(function () {
              if (bootSkipped || i < printed) return;
              fn();
              printed = i + 1;
              if (i === steps.length - 1) { disarmSkip(); makePrompt(); }
            }, delays[i] || 1400));
          });
          function skip() {
            if (bootSkipped) return;
            bootSkipped = true;
            disarmSkip();
            timers.forEach(clearTimeout);
            for (var i = printed; i < steps.length; i++) steps[i]();
            printed = steps.length;
            makePrompt();
          }
          window.addEventListener("pointerdown", skip);
          window.addEventListener("keydown", skip);
          setTimeout(function () { /* safety: prompt by ~2.1s even if a step was skipped */ if (!currentInput && !bootSkipped) { /* steps handle it */ } }, 2200);
        }

        /* ---------- wiring ---------- */
        stage.addEventListener("click", function (ev) {
          if (ev.target.closest("a")) return;
          focusInput();
        });

        if (window.visualViewport) {
          var vv = window.visualViewport;
          var applyVv = function () { stage.style.height = vv.height + "px"; };
          vv.addEventListener("resize", applyVv);
          applyVv();
        }

        /* ---------- config first (fast), then boot ---------- */
        var bootStarted = false;
        function start() { if (!bootStarted) { bootStarted = true; boot(); } }
        fetch("id-config.json", { cache: "no-store" })
          .then(function (res) { if (!res.ok) throw new Error("no config"); return res.json(); })
          .then(function (data) {
            cfg = Object.assign({}, DEFAULTS, data || {});
            if (cfg.pageTitle) document.title = cfg.pageTitle;
          })
          .catch(function () {})
          .then(start);
        setTimeout(start, 700);
      })();
    </script>
    <script>
      /* ---------- truongOS desktop window manager (min-width: 1025px) ----------
         Only runs its layout when the viewport is wider than 1024px. On
         narrower screens this script does nothing and the page stays the
         fullscreen terminal. The terminal's own script above is untouched:
         the window manager only moves its <section> around, and the
         terminal keeps working exactly as on mobile. */
      (function () {
        "use strict";

        var mq = window.matchMedia("(min-width: 1025px)");
        var stage = document.getElementById("stage");
        var termWin = document.getElementById("termWindow");
        var dock = document.getElementById("dock");
        if (!stage || !termWin || !dock) return;

        function isDesktop() { return mq.matches; }

        var zTop = 20;
        var wins = {}; /* key -> window element (folder / note / app windows) */
        var termMoved = false;

        /* ----- focus / z-order ----- */
        function focusWin(el) {
          zTop += 1;
          el.style.zIndex = zTop;
          var all = stage.querySelectorAll(".window");
          for (var i = 0; i < all.length; i++) all[i].classList.toggle("inactive", all[i] !== el);
          var btn = dock.querySelector('[data-dock]');
          var mine = null;
          for (var j = 0; j < dock.children.length; j++) {
            if (dock.children[j].getAttribute("data-win") === el.getAttribute("data-win")) mine = dock.children[j];
          }
          if (mine) mine.classList.remove("minimized");
          void btn;
        }

        /* ----- dock ----- */
        function dockItem(key, glyph, label, onActivate) {
          var b = dock.querySelector('[data-dock="' + key + '"]');
          if (b) return b;
          b = document.createElement("button");
          b.setAttribute("data-dock", key);
          b.setAttribute("data-win", key);
          b.setAttribute("aria-label", label);
          b.textContent = glyph;
          b.addEventListener("click", onActivate);
          dock.appendChild(b);
          return b;
        }
        function undock(key) {
          var b = dock.querySelector('[data-dock="' + key + '"]');
          if (b) b.remove();
        }
        function markMinimized(key, on) {
          var b = dock.querySelector('[data-dock="' + key + '"]');
          if (b) b.classList.toggle("minimized", !!on);
        }

        /* ----- drag / resize / maximize ----- */
        function dragify(el) {
          var bar = el.querySelector(".titlebar");
          if (!bar) return;
          bar.addEventListener("pointerdown", function (ev) {
            if (!isDesktop() || ev.target.closest("button, .dot")) return;
            focusWin(el);
            if (el.dataset.maxed === "1") return;
            var sx = ev.clientX, sy = ev.clientY;
            var ox = el.offsetLeft, oy = el.offsetTop;
            document.body.style.userSelect = "none";
            function move(e2) {
              el.style.left = Math.max(-el.offsetWidth + 120, Math.min(stage.clientWidth - 60, ox + e2.clientX - sx)) + "px";
              el.style.top = Math.max(30, Math.min(stage.clientHeight - 30, oy + e2.clientY - sy)) + "px";
              if (el === termWin) termMoved = true;
            }
            function up() {
              document.body.style.userSelect = "";
              window.removeEventListener("pointermove", move);
              window.removeEventListener("pointerup", up);
            }
            window.addEventListener("pointermove", move);
            window.addEventListener("pointerup", up);
          });
          el.addEventListener("pointerdown", function () { if (isDesktop()) focusWin(el); });
        }

        function resizify(el) {
          var h = el.querySelector(".resize-handle");
          if (!h) return;
          h.addEventListener("pointerdown", function (ev) {
            if (!isDesktop()) return;
            ev.preventDefault();
            ev.stopPropagation();
            focusWin(el);
            if (el.dataset.maxed === "1") return;
            var sx = ev.clientX, sy = ev.clientY, ow = el.offsetWidth, oh = el.offsetHeight;
            document.body.style.userSelect = "none";
            function move(e2) {
              el.style.width = Math.max(360, Math.min(stage.clientWidth - el.offsetLeft - 8, ow + e2.clientX - sx)) + "px";
              el.style.height = Math.max(260, Math.min(stage.clientHeight - el.offsetTop - 8, oh + e2.clientY - sy)) + "px";
            }
            function up() {
              document.body.style.userSelect = "";
              window.removeEventListener("pointermove", move);
              window.removeEventListener("pointerup", up);
            }
            window.addEventListener("pointermove", move);
            window.addEventListener("pointerup", up);
          });
        }

        function toggleMax(el) {
          if (el.dataset.maxed === "1") {
            el.dataset.maxed = "";
            el.style.left = el.dataset.pl;
            el.style.top = el.dataset.pt;
            el.style.width = el.dataset.pw;
            el.style.height = el.dataset.ph;
          } else {
            el.dataset.pl = el.style.left;
            el.dataset.pt = el.style.top;
            el.dataset.pw = el.style.width;
            el.dataset.ph = el.style.height;
            el.dataset.maxed = "1";
            el.style.left = "8px";
            el.style.top = "38px";
            el.style.width = (stage.clientWidth - 16) + "px";
            el.style.height = (stage.clientHeight - 46) + "px";
          }
        }

        function placeCascade(el, w, h) {
          var n = Object.keys(wins).length;
          var cw = Math.min(w, stage.clientWidth - 16);
          var ch = Math.min(h, stage.clientHeight - 46);
          el.style.width = cw + "px";
          el.style.height = ch + "px";
          el.style.left = Math.max(8, Math.min(stage.clientWidth - cw - 8, (stage.clientWidth - cw) / 2 + (n % 5) * 36 - 72)) + "px";
          el.style.top = Math.max(38, Math.min(stage.clientHeight - ch - 8, 30 + (stage.clientHeight - 30 - ch) / 2 + (n % 5) * 28 - 56)) + "px";
        }

        /* ----- window factory ----- */
        function makeWin(key, title, bodyEl, w, h, glyph, dockLabel) {
          var ex = wins[key];
          if (ex) {
            if (ex.style.display === "none") ex.style.display = "";
            focusWin(ex);
            return ex;
          }
          var sec = document.createElement("section");
          sec.className = "window app-window";
          sec.setAttribute("data-win", key);
          sec.setAttribute("aria-label", title);
          var bar = document.createElement("div");
          bar.className = "titlebar";
          var cr = document.createElement("button"); cr.className = "dot r"; cr.setAttribute("aria-label", "Close window");
          var mn = document.createElement("button"); mn.className = "dot y"; mn.setAttribute("aria-label", "Minimize window");
          var mx = document.createElement("button"); mx.className = "dot g"; mx.setAttribute("aria-label", "Maximize window");
          var tt = document.createElement("span"); tt.className = "tt"; tt.textContent = title;
          bar.appendChild(cr); bar.appendChild(mn); bar.appendChild(mx); bar.appendChild(tt);
          sec.appendChild(bar);
          sec.appendChild(bodyEl);
          var rz = document.createElement("div"); rz.className = "resize-handle"; rz.setAttribute("aria-hidden", "true");
          sec.appendChild(rz);
          stage.appendChild(sec);
          wins[key] = sec;

          cr.addEventListener("click", function () {
            sec.remove();
            delete wins[key];
            undock(key);
          });
          mn.addEventListener("click", function () {
            sec.style.display = "none";
            markMinimized(key, true);
          });
          mx.addEventListener("click", function () { toggleMax(sec); });

          placeCascade(sec, w, h);
          dragify(sec);
          resizify(sec);
          dockItem(key, glyph, dockLabel, function () {
            if (sec.style.display === "none") sec.style.display = "";
            focusWin(sec);
          });
          focusWin(sec);
          return sec;
        }

        /* ----- the "filesystem": folders + documents -----
           Document text is rendered from id-config.json — the same source
           the terminal commands read — so the note view and the terminal
           can never drift apart. */
        var FOLDERS = ["About", "Skills", "Sites"];
        var FILES = {
          "About": [
            { name: "profile.txt", type: "doc", doc: "profile" },
            { name: "contact.txt", type: "doc", doc: "contact" }
          ],
          "Skills": [
            { name: "skills.txt", type: "doc", doc: "skills" }
          ],
          "Sites": [
            { name: "sites.txt", type: "doc", doc: "sites" }
          ]
        };
        var GLOSSES = {
          "interfaces": "clean, usable interfaces for web products",
          "systems": "practical systems that make complicated work feel simple",
          "operations": "dependable day-to-day running of things"
        };

        var cfgPromise = null;
        function getCfg() {
          if (!cfgPromise) {
            cfgPromise = fetch("id-config.json", { cache: "no-store" })
              .then(function (r) { return r.json(); })
              .catch(function () { return {}; });
          }
          return cfgPromise;
        }

        function docText(kind, cfg) {
          var name = (((cfg.firstName || "Truong") + " " + (cfg.lastName || "Nguyen.")).trim());
          var role = cfg.role || "Front-end engineer";
          var stmt = cfg.statement || "";
          var code = (cfg.eyebrow || "Professional identity") + " · " + (cfg.portraitCode || "") + " · " + (cfg.serial || "");
          if (kind === "profile") return name + " — " + role + "\n" + stmt + "\n" + code;
          if (kind === "contact") return "No public inbox.\nSee sites.txt for the places I keep up.";
          if (kind === "skills") {
            return (cfg.specialties || []).map(function (s) {
              var flag = "--" + String(s).toLowerCase().replace(/\s+/g, "-");
              var g = GLOSSES[String(s).toLowerCase()] || "";
              return flag + "  " + s + (g ? " — " + g : "");
            }).join("\n");
          }
          if (kind === "sites") {
            var lines = ["Places I keep up:", "truongnpt.com — blog, writing & projects", "guihangmy.com — Dino Gửi Hàng Mỹ, proxy shipping US → VN"];
            (cfg.links || []).forEach(function (l) {
              if (l && l.label) lines.push(l.label + (l.href ? " — " + l.href : ""));
            });
            return lines.join("\n");
          }
          return "";
        }

        function openDoc(kind, filename) {
          var key = "doc:" + kind;
          if (wins[key]) {
            var ex = wins[key];
            if (ex.style.display === "none") ex.style.display = "";
            focusWin(ex);
            return;
          }
          getCfg().then(function (cfg) {
            var body = document.createElement("div");
            body.className = "note-body";
            body.textContent = docText(kind, cfg);
            makeWin(key, filename, body, 520, 420, "📄", filename);
          });
        }

        function openFolder(name) {
          var key = "folder:" + name;
          if (wins[key]) {
            var ex = wins[key];
            if (ex.style.display === "none") ex.style.display = "";
            focusWin(ex);
            return;
          }
          var hist = [name], hi = 0;
          var body = document.createElement("div");
          body.className = "app-body";
          var side = document.createElement("aside");
          side.className = "app-sidebar";
          var filesEl = document.createElement("div");
          filesEl.className = "app-files";
          body.appendChild(side);
          body.appendChild(filesEl);

          var wrap = document.createElement("div");
          wrap.style.display = "flex";
          wrap.style.flexDirection = "column";
          wrap.style.flex = "1 1 auto";
          wrap.style.minHeight = "0";
          var toolbar = document.createElement("div");
          toolbar.className = "app-toolbar";
          var back = document.createElement("button"); back.className = "navbtn"; back.setAttribute("aria-label", "Back"); back.textContent = "‹";
          var fwd = document.createElement("button"); fwd.className = "navbtn"; fwd.setAttribute("aria-label", "Forward"); fwd.textContent = "›";
          var pathEl = document.createElement("span"); pathEl.className = "app-path";
          toolbar.appendChild(back); toolbar.appendChild(fwd); toolbar.appendChild(pathEl);
          wrap.appendChild(toolbar);
          wrap.appendChild(body);

          var sideBtns = {};
          FOLDERS.forEach(function (f) {
            var b = document.createElement("button");
            b.textContent = f;
            b.addEventListener("click", function () {
              if (hist[hi] === f) return;
              hist = hist.slice(0, hi + 1);
              hist.push(f);
              hi++;
              render();
            });
            side.appendChild(b);
            sideBtns[f] = b;
          });
          back.addEventListener("click", function () { if (hi > 0) { hi--; render(); } });
          fwd.addEventListener("click", function () { if (hi < hist.length - 1) { hi++; render(); } });

          function render() {
            var cur = hist[hi];
            pathEl.textContent = "truongOS / " + cur;
            back.disabled = hi === 0;
            fwd.disabled = hi >= hist.length - 1;
            FOLDERS.forEach(function (f) { sideBtns[f].classList.toggle("active", f === cur); });
            filesEl.textContent = "";
            (FILES[cur] || []).forEach(function (f) {
              var row = document.createElement("div");
              row.className = "file-row";
              var g = document.createElement("span"); g.className = "fglyph"; g.textContent = "📄";
              var n = document.createElement("span"); n.textContent = f.name;
              row.appendChild(g);
              row.appendChild(n);
              row.addEventListener("click", function () { openDoc(f.doc, f.name); });
              filesEl.appendChild(row);
            });
          }
          render();
          makeWin(key, name, wrap, 580, 430, "📁", name);
        }

        function openApp(key, title, url, glyph) {
          var full = "app:" + key;
          if (wins[full]) {
            var ex = wins[full];
            if (ex.style.display === "none") ex.style.display = "";
            focusWin(ex);
            return;
          }
          var frame = document.createElement("iframe");
          frame.src = url;
          frame.title = title;
          makeWin(full, title, frame, 920, 640, glyph, title);
        }

        /* ----- terminal window: center it, make it draggable/resizable ----- */
        function centerTerm() {
          if (termMoved) return;
          var w = Math.min(720, stage.clientWidth - 16);
          var h = Math.min(600, stage.clientHeight - 46);
          termWin.style.width = w + "px";
          termWin.style.height = h + "px";
          termWin.style.left = Math.max(8, (stage.clientWidth - w) / 2) + "px";
          termWin.style.top = Math.max(38, 30 + (stage.clientHeight - 30 - h) / 2) + "px";
        }

        function restoreTerm() {
          if (termWin.style.display === "none") termWin.style.display = "";
          focusWin(termWin);
        }

        function initDesktop() {
          termWin.setAttribute("data-win", "term");
          var tb = termWin.querySelector(".titlebar");
          if (tb) tb.removeAttribute("aria-hidden");
          var dots = termWin.querySelectorAll(".dot");
          if (dots[0]) { dots[0].setAttribute("role", "button"); dots[0].setAttribute("aria-label", "Close Terminal"); dots[0].addEventListener("click", function () { termWin.style.display = "none"; markMinimized("term", true); }); }
          if (dots[1]) { dots[1].setAttribute("role", "button"); dots[1].setAttribute("aria-label", "Minimize Terminal"); dots[1].addEventListener("click", function () { termWin.style.display = "none"; markMinimized("term", true); }); }
          if (dots[2]) { dots[2].setAttribute("role", "button"); dots[2].setAttribute("aria-label", "Maximize Terminal"); dots[2].addEventListener("click", function () { toggleMax(termWin); }); }
          var rz = document.createElement("div");
          rz.className = "resize-handle";
          rz.setAttribute("aria-hidden", "true");
          termWin.appendChild(rz);
          dragify(termWin);
          resizify(termWin);
          centerTerm();
          dockItem("term", "💻", "Terminal", restoreTerm);
          focusWin(termWin);
        }

        function teardownDesktop() {
          /* Crossing back below 1024px: park every desktop window and let
             the terminal resume its centered fullscreen layout. */
          Object.keys(wins).forEach(function (k) { wins[k].style.display = "none"; });
          termWin.style.left = "";
          termWin.style.top = "";
          termWin.style.width = "";
          termWin.style.height = "";
          termWin.style.zIndex = "";
          termWin.style.display = "";
          termWin.classList.remove("inactive");
        }

        /* ----- desktop icons ----- */
        var icons = document.querySelectorAll(".dicon");
        for (var i = 0; i < icons.length; i++) {
          icons[i].addEventListener("click", function () {
            if (!isDesktop()) return;
            var target = this.getAttribute("data-open");
            if (target === "term") restoreTerm();
            else if (target.indexOf("folder:") === 0) openFolder(target.slice(7));
            else if (target === "app:arcade") openApp("arcade", "Minh's Arcade", "/arcade/", "🎮");
            else if (target === "app:map") openApp("map", "SoCal City Map", "/map/", "🗺️");
          });
        }

        /* ----- menu bar clock ----- */
        var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        var MONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function tickClock() {
          var el = document.getElementById("menuClock");
          if (!el) return;
          var d = new Date();
          var h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
          h = h % 12 || 12;
          var mm = String(d.getMinutes());
          if (mm.length < 2) mm = "0" + mm;
          el.textContent = DAYS[d.getDay()] + " " + MONS[d.getMonth()] + " " + d.getDate() + "  " + h + ":" + mm + " " + ap;
        }
        tickClock();
        setInterval(tickClock, 30000);

        /* ----- mode switching ----- */
        function onModeChange() {
          if (isDesktop()) {
            Object.keys(wins).forEach(function (k) { if (wins[k].dataset.wasHidden !== "1") wins[k].style.display = ""; });
            centerTerm();
            focusWin(termWin);
          } else {
            teardownDesktop();
          }
        }
        if (mq.addEventListener) mq.addEventListener("change", onModeChange);
        else if (mq.addListener) mq.addListener(onModeChange);

        if (isDesktop()) initDesktop();
      })();
    </script>
